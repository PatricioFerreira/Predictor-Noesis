name: Diagnóstico boletín Brasil (SGB)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-sgb.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pdfplumber
      - name: Buscar la dirección nueva
        run: |
          exec > >(tee -a /tmp/diag.txt) 2>&1
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in https://sace.sgb.gov.br/uruguai/ https://sace.sgb.gov.br/uruguai/ultimo_boletim.php https://sace.sgb.gov.br/ https://sace.sgb.gov.br/guaiba/ \
                   https://www.sgb.gov.br/sace/boletins/Uruguai/20261008_07-20261008%20-%20083642.pdf https://www.sgb.gov.br/sala-de-imprensa \
                   https://www.sgb.gov.br/w/rs-niveis-do-rio-uruguai-e-afluentes-mantem-tendencia-de-declinio-na-fronteira-oeste \
                   https://www.sgb.gov.br/w/bacia-do-rio-uruguai-niveis-dos-rios-seguem-elevados ; do
            echo; echo "=== $u"; curl -sS -L -m 60 -A "$A" -o /tmp/r -w "HTTP %{http_code} · %{content_type} · %{size_download} bytes · final %{url_effective}\n" "$u" || echo "CURL FALLÓ"
            file -b /tmp/r
            grep -o -i -E '(href|src|action)="[^"]*(sace|boletim|boletin|uruguai|\.pdf|alerta|hidro)[^"]*"' /tmp/r | sort -u | head -40
            grep -o -i -E 'https?://[a-z0-9.-]*sgb[a-z0-9./_?=&%-]*' /tmp/r | sort -u | head -30
            grep -o -E '[0-9]{2}/[0-9]{2}/2026[^<]{0,40}' /tmp/r | head -5
          done
      - name: Guardar el resultado en el repo
        if: always()
        run: |
          mkdir -p data/diag && cp /tmp/diag.txt data/diag/sgb.txt
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add data/diag/sgb.txt && git commit -m "Diagnóstico SGB" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
