name: Diagnóstico boletín Brasil (SGB)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-sgb.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pdfplumber
      - name: Bajar las páginas nuevas
        run: |
          exec > >(tee -a /tmp/diag.txt) 2>&1
          mkdir -p /tmp/pag; cd /tmp/pag
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ echo "=== $2 <- $1"; curl -sS -L -m 60 -A "$A" -o "$2" -w "HTTP %{http_code} · %{content_type} · %{size_download} bytes · final %{url_effective}\n" "$1" || echo "CURL FALLÓ"; }
          get "https://sace.sgb.gov.br/" raiz.html
          get "https://sace.sgb.gov.br/estacoes_lista.php?bacia=uruguai" lista.html
          get "https://sace.sgb.gov.br/estacoes_mapa.php?bacia=uruguai" mapa.html
          get "https://sace.sgb.gov.br/uruguai/" uruguai.html
          get "https://sace.sgb.gov.br/uruguai/jsJawrPath/telas/publicacao/boletim/boletimScript.js" boletimScript.js
          get "https://sace.sgb.gov.br/uruguai/jsJawrPath/telas/publicacao/textoBoletim/textoBoletimScript.js" textoBoletimScript.js
          get "https://www.sgb.gov.br/w/rs-monitoramento-no-rio-uruguai-aponta-estabilizacao-em-sao-borja-e-elevacao-dos-niveis-em-itaqui-e-uruguaiana" nota.html
      - name: Guardar el resultado en el repo
        if: always()
        run: |
          mkdir -p data/diag && cp /tmp/diag.txt data/diag/sgb.txt; cp -r /tmp/pag data/diag/ || true
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add data/diag && git commit -m "Diagnóstico SGB" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
