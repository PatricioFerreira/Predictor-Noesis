name: Diagnóstico boletín Brasil (SGB)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-sgb.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pdfplumber
      - name: Bajar datos por estación y probar el último boletín
        run: |
          exec > >(tee -a /tmp/diag.txt) 2>&1
          mkdir -p /tmp/pag; cd /tmp/pag
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ echo "=== $2 <- $1"; curl -sS -L -m 60 -A "$A" -o "$2" -w "HTTP %{http_code} · %{content_type} · %{size_download} bytes\n" "$1" || echo "CURL FALLÓ"; }
          get "https://sace.sgb.gov.br/relatorio.php?bacia=uruguai&pm=29&s=172&sr=173" rel_uruguaiana.html
          get "https://sace.sgb.gov.br/relatorio.php?bacia=uruguai&pm=33&s=202&sr=203" rel_saoborja.html
          get "https://sace.sgb.gov.br/relatorio.php?apenas_grafico=sim&bacia=uruguai&pm=32&s=190&sr=191" rel_itaqui_graf.html
          # DWR: BoletimService.obtemUltimoBoletim
          curl -sS -m 60 -A "$A" -c cj -o /dev/null https://sace.sgb.gov.br/uruguai/
          get "https://sace.sgb.gov.br/uruguai/dwr/interface/BoletimService.js" dwr_iface.js
          printf 'callCount=1\npage=/uruguai/\nhttpSessionId=\nscriptSessionId=\nc0-scriptName=BoletimService\nc0-methodName=obtemUltimoBoletim\nc0-id=0\nbatchId=0\n' > body.txt
          echo "=== dwr_call.txt"; curl -sS -m 60 -A "$A" -b cj -H "Content-Type: text/plain" --data-binary @body.txt -o dwr_call.txt -w "HTTP %{http_code} · %{size_download} bytes\n" "https://sace.sgb.gov.br/uruguai/dwr/call/plaincall/BoletimService.obtemUltimoBoletim.dwr"; head -c 1500 dwr_call.txt; echo
      - name: Guardar el resultado en el repo
        if: always()
        run: |
          mkdir -p data/diag && cp /tmp/diag.txt data/diag/sgb.txt; cp -r /tmp/pag data/diag/ || true
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add data/diag && git commit -m "Diagnóstico SGB" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
