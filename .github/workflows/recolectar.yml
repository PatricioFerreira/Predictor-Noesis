name: Recolectar datos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "web/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: recolectar
  cancel-in-progress: false
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet netCDF4 numpy
      - run: python collector/collect.py
      - name: Guardar datos
        run: |
          git config user.name "recolector"
          git config user.email "recolector@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
      - name: Armar la página web
        run: python web/armar_sitio.py
      - name: Configurar Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Subir la página
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
