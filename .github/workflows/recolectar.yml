name: Recolectar datos
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/collect.py
      - name: Guardar datos
        run: |
          git config user.name "recolector"
          git config user.email "recolector@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
