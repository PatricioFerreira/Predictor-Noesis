name: Recolectar datos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "web/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet netCDF4 numpy pdfplumber
      - name: Una corrida completa y publicar la página
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          python collector/vivo.py una
