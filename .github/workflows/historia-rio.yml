name: Bajar historia del río (CTM)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/historia-rio.yml", "collector/historia_rio.py"]
permissions:
  contents: write
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/historia_rio.py 12 || true
      - run: |
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add data/historial/ctm-niveles-horario.csv data/historial/ctm-historia-log.txt && git commit -m "Historia horaria de niveles CTM" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
