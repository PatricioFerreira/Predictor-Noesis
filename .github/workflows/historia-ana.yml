name: Bajar historia de Brasil (ANA)
on:
  push:
    branches: [main]
    paths: [".github/workflows/historia-ana.yml"]
permissions:
  contents: write
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/historia_ana.py 12 || true
      - run: |
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add data/historial/ana-niveles-horario.csv data/historial/ana-historia-log.txt && git commit -m "Historia horaria de niveles ANA (Brasil)" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
