name: Diagnóstico historia Brasil
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-brasil.yml", "diag/brasil_historia.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diag/brasil_historia.py || true
      - run: |
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add -f diag/brasil_historia.txt && git commit -m "Resultado diagnóstico Brasil" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 7; done
