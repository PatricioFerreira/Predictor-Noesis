name: Sondeo
on:
  push:
    branches: [main]
    paths: ["probe/*"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash probe/sondear.sh
      - run: |
          git config user.name recolector; git config user.email recolector@users.noreply.github.com
          git add probe/out; git commit -m "sondeo" || true; git pull --rebase; git push
