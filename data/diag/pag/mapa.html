		* Quando se clica no mapa (contêiner .leaflet-container), nos controles

		* Forçamos `preventScroll: true` para que o foco NUNCA desloque a página.

		(function () {

			var __origFocus = HTMLElement.prototype.focus;

				// Mantém compatibilidade com a antiga assinatura baseada em callback

				}

		const legendaAlertas = [["Normal","#00FF33"]];
		const legendaTemShapes = true;

		// [cor, texto] da legenda de precipitação (mesmas faixas das classes chuva-tooltip-*)
		const legendaPrecip = [
			['#ff3333', 'Acima de 50 mm'],
			['#ff9900', 'Entre 25 e 50 mm'],
			['#ffe066', 'Entre 5 e 25 mm'],
			['#00ccff', 'Entre 0,1 e 5 mm'],
			['#ffffff', 'Abaixo de 0,1 mm']
		];

		const legendaControl = L.control({ position: 'topright' });

		legendaControl.onAdd = function () {
			const div  = L.DomUtil.create('div', 'legenda-sace');
			const cab  = L.DomUtil.create('div', 'cab', div);
			const tit  = L.DomUtil.create('span', '', cab);
			const seta = L.DomUtil.create('span', 'seta', cab);
			const corpo = L.DomUtil.create('div', 'corpo', div);

			function secao(texto) {
				const d = L.DomUtil.create('div', 'secao', corpo);
				d.textContent = texto;
			}
			function item(classe, cor, texto) {
				const d = L.DomUtil.create('div', 'item', corpo);
				const s = L.DomUtil.create('span', classe, d);
				if (cor) s.style.background = cor;
				d.appendChild(document.createTextNode(texto));
			}
			function atualizaSeta() {
				seta.textContent = div.classList.contains('fechada') ? '▸' : '▾';
			}

			// Monta o conteúdo conforme o modo: 'estacoes' (padrão) ou 'chuva'
			this._render = function (modo) {
				corpo.innerHTML = '';

				if (modo === 'chuva') {
					tit.textContent = 'Legenda - Precipitação';
					secao('Chuva acumulada ' + (typeof periodoChuvaAtual !== 'undefined' ? periodoChuvaAtual : 24) + 'h');
					legendaPrecip.forEach(function (p) { item('ponto', p[0], p[1]); });
				} else {
					tit.textContent = 'Legenda';
					secao('Pontos de Monitoramento');
					legendaAlertas.forEach(function (a) { item('ponto', a[1], a[0]); });
				}

				// Bacia e hidrografia aparecem nos dois modos
				if (legendaTemShapes) {
					secao('Bacia Hidrográfica');
					item('area', null, 'Área da bacia');
					secao('Hidrografia');
					item('rio', null, 'Rios e cursos d\'água');
				}
			};

			// Em telas pequenas começa recolhida
			if (window.innerWidth < 600) div.classList.add('fechada');
			atualizaSeta();

			cab.onclick = function () {
				div.classList.toggle('fechada');
				atualizaSeta();
			};

			L.DomEvent.disableClickPropagation(div);
			L.DomEvent.disableScrollPropagation(div);

			this._render('estacoes');
			return div;
		};

		// Troca o conteúdo da legenda sem recriar o controle
		legendaControl.setModo = function (modo) {
			if (this._render) this._render(modo);
		};

		legendaControl.addTo(map);

		function deveMostrarLogo() {
			return map.getContainer().clientWidth >= 768;
		}

		function colocarLogoSgb() {
			if (!deveMostrarLogo()) {
				if (logoMarker) {
					map.removeLayer(logoMarker);
					logoMarker = null;
				}
				return;
			}

			if (!podeMostrarLogo) return;

			
			var pontoLogoSgb = [-29.4791,-52.4707];

			var LOGO_FRACAO_LARGURA = 0.12;
			var LOGO_ASPECT = 736 / 1387;

			function calcBounds(centro) {
				// Largura visível do mapa em pixels, no zoom atual
				var larguraMapaPx = map.getSize().x;
				var larguraLogoPx = larguraMapaPx * LOGO_FRACAO_LARGURA;
				var alturaLogoPx  = larguraLogoPx * LOGO_ASPECT;

				// Projeta o centro no zoom ATUAL e desloca em pixels.
				// Como o deslocamento é feito no zoom atual, a logo sempre
				// ocupa a mesma fração da tela naquele zoom.
				var c = L.latLng(centro);
				var z = map.getZoom();
				var p = map.project(c, z);
				var meiaLarg = larguraLogoPx / 2;
				var meiaAlt  = alturaLogoPx  / 2;

				var cantoSW = map.unproject(L.point(p.x - meiaLarg, p.y + meiaAlt), z);
				var cantoNE = map.unproject(L.point(p.x + meiaLarg, p.y - meiaAlt), z);

				return L.latLngBounds(cantoSW, cantoNE);
			}

			var novosBounds = calcBounds(pontoLogoSgb);

			// Se já existe e os bounds são iguais (dentro de uma tolerância),
			// não recria: evita a piscada.
			if (logoMarker) {
				var b = logoMarker.getBounds();
				var mesmo =
					Math.abs(b.getSouth() - novosBounds.getSouth()) < 1e-9 &&
					Math.abs(b.getNorth() - novosBounds.getNorth()) < 1e-9 &&
					Math.abs(b.getWest()  - novosBounds.getWest())  < 1e-9 &&
					Math.abs(b.getEast()  - novosBounds.getEast())  < 1e-9;
				if (mesmo) return;
				map.removeLayer(logoMarker);
				logoMarker = null;
			}

			logoMarker = L.imageOverlay('./img/logosgb_chapada_vertical_2026.png',
										novosBounds,
										{ interactive: false }).addTo(map);

			// Fade-in só na primeira criação
			var el = logoMarker.getElement();
			if (el) {
				el.style.opacity = '0';
				el.style.transition = 'opacity 3.0s ease';
				requestAnimationFrame(function () {
					requestAnimationFrame(function () { el.style.opacity = '1'; });
				});
			}

			// Ajuste da logo: acesse com ?ajustar=1 e clique no mapa (define o CENTRO
			// da logo). Cole o 'lat', 'lng' no array $dadosBacia em _util.php.
			if (location.search.indexOf('ajustar=1') !== -1) {
				var anchorDot = L.circleMarker(pontoLogoSgb, {
					radius: 4, color: '#ff0000', fillColor: '#ff0000', fillOpacity: 1
				}).addTo(map);

				map.on('click', function (e) {
					logoMarker.setBounds(calcBounds(e.latlng));
					anchorDot.setLatLng(e.latlng);
					var linha = "'" + e.latlng.lat.toFixed(4) + "', '" + e.latlng.lng.toFixed(4) + "'";
					console.log(linha);
					if (navigator.clipboard) navigator.clipboard.writeText(linha);
				});
			}
		}

		map.on('popupopen', function (event) {
			popupRelatorioAberto = event.popup;
			usuarioAlterouMapa = true;
			var el = document.querySelector('.legenda-sace');
			if (el) el.style.display = 'none';
			var zoomEl = map.getContainer().querySelector('.leaflet-control-zoom');
			if (zoomEl) zoomEl.style.display = 'none';
		});

		map.on('popupclose', function (event) {
			if (popupRelatorioAberto === event.popup) {
				popupRelatorioAberto = null;
			}
			var el = document.querySelector('.legenda-sace');
			if (el) el.style.display = '';
			var zoomEl = map.getContainer().querySelector('.leaflet-control-zoom');
			if (zoomEl) zoomEl.style.display = '';
		});

		var resizeTimer = null;
		function atualizarMapaAposRedimensionar() {
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(function () {
				if (emVooInicial) return;
				map.invalidateSize({ pan: false });

				if (popupRelatorioAberto && popupRelatorioAberto.isOpen()) {
					popupRelatorioAberto.update();
					if (deveMostrarLogo() !== !!logoMarker) {
						colocarLogoSgb();
					}
					return;
				}

				// Reajusta o enquadramento inicial para as novas dimensões do mapa.
				var limitesMapa = baciaLayer && baciaLayer.getBounds().isValid()
					? baciaLayer.getBounds()
					: (bounds.length ? bounds : null);
				if (mapaPronto && !usuarioAlterouMapa && limitesMapa) {
					reenquadrandoMapa = true;
					map.fitBounds(limitesMapa, { padding: [30, 30], animate: false });
					reenquadrandoMapa = false;
					colocarLogoSgb();
					return;
				}

				// Só recria se a visibilidade da logo mudou.
				var mostrando = !!logoMarker;
				if (deveMostrarLogo() !== mostrando) {
					colocarLogoSgb();
				}
			}, 200);
		}

		window.addEventListener('resize', atualizarMapaAposRedimensionar);

		if (window.ResizeObserver) {
			new ResizeObserver(atualizarMapaAposRedimensionar).observe(map.getContainer());
		}

	</script>
